name: 生产准入回归

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DBHUB_DASHBOARD_BACKEND_IMAGE: dbhub-backend:release-check
      DBHUB_DASHBOARD_FRONTEND_IMAGE: dbhub-frontend:release-check
      DBHUB_BACKUP_IMAGE: dbhub-backup:release-check
      DBHUB_JDBC_RUNTIME_IMAGE: dbhub-jdbc:release-check
      DBHUB_DASHBOARD_USE_IMAGE: "1"
      DBHUB_CHROMIUM_PATH: ""
    steps:
      - name: 配置本次运行的隔离目录
        run: |
          printf 'DBHUB_STATE_DIR=%s/dbhub-state\nDBHUB_BUILD_ROOT=%s/dbhub-build\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验回归入口的失败与跳过判定
        run: python -m unittest discover -s scripts/cloud -p 'test_regression.py'
      - name: 启动真实依赖
        run: ./scripts/cloud/dev.sh up -d --wait --wait-timeout 240 postgres mysql redis jdbc
      - name: 校验工作流语法和上下文
        run: ./scripts/cloud/dev.sh run --rm --no-deps -w /tmp -e GOFLAGS=-mod=mod backend go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 /app/.github/workflows/production-readiness.yml /app/.github/workflows/datasource-compatibility.yml
      - name: 后端全量竞态、静态检查、Go 漏洞扫描及前端审计、回归与构建
        run: python scripts/cloud/regression.py --profile full
      - name: 构建实际生产镜像
        run: |
          docker build -t "$DBHUB_DASHBOARD_BACKEND_IMAGE" -f backend/Dockerfile backend
          docker build -t "$DBHUB_DASHBOARD_FRONTEND_IMAGE" -f frontend/Dockerfile frontend
          docker build -t "$DBHUB_BACKUP_IMAGE" -f scripts/ops/Dockerfile scripts/ops
          docker build --secret id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt -t "$DBHUB_JDBC_RUNTIME_IMAGE" -f services/jdbc-runner/Dockerfile services/jdbc-runner
      - name: 安装隔离浏览器
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: 验证四种部署方式的配置与 Kubernetes Schema
        run: |
          python -m pip install -r deploy/requirements-check.txt
          python -m unittest discover -s scripts/deploy -p 'test_*.py'
          python scripts/deploy/check.py --schema
      - name: 构建源码部署包并验证 Docker、源码运行
        # Source JDBC is compiled on the runner using the selected JDK below.
        run: |
          ./scripts/cloud/dev.sh run --rm --no-deps backend sh /app/deploy/source/build.sh backend /runtime/source-release
          ./scripts/cloud/dev.sh run --rm --no-deps frontend sh /app/deploy/source/build.sh frontend /runtime/source-release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 编译源码 JDBC 并执行部署运行回归
        run: |
          sh deploy/source/build.sh jdbc "$DBHUB_STATE_DIR/source-release"
          DBHUB_SOURCE_BUNDLE="$DBHUB_STATE_DIR/source-release" python scripts/deploy/runtime_check.py
      - name: 报表与仪表盘真实浏览器回归
        run: python scripts/cloud/dashboard_acceptance.py
      - name: 独立审批与 Cookie CSRF 真实浏览器安全回归
        run: python scripts/cloud/security_acceptance.py
      - name: 故障恢复、限流与完整备份恢复
        run: python scripts/cloud/production_acceptance.py --duration 0
      - name: 通知、数据源后台任务与自动备份
        run: python scripts/cloud/automation_acceptance.py
      - name: 保存无敏感内容的验收结论
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dbhub-state/regression-artifacts/**/summary.json
            ${{ runner.temp }}/dbhub-state/dashboard-artifacts/**/checks.json
            ${{ runner.temp }}/dbhub-state/production-acceptance/**/checks.json
          if-no-files-found: warn
          retention-days: 14
      - name: 清理本次依赖
        if: always()
        run: ./scripts/cloud/dev.sh down
