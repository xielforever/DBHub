apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbhub.name" . }}-backend
  labels:
    {{- include "dbhub.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "dbhub.image" .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          envFrom:
            - configMapRef: {name: {{ include "dbhub.name" . }}-config}
            - secretRef: {name: {{ .Values.existingSecret }}}
          env:
            - {name: APP_ENV, value: production}
            - {name: HTTP_BIND_HOST, value: ""}
            - {name: PORT, value: "8080"}
            - {name: DBHUB_AUDIT_DIR, value: /var/lib/dbhub/audit}
            {{- if .Values.jdbc.enabled }}
            - {name: DBHUB_JDBC_URL, value: "http://{{ include "dbhub.name" . }}-jdbc:8090"}
            {{- end }}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /api/ready, port: http}, periodSeconds: 2, failureThreshold: 90}
          readinessProbe: {httpGet: {path: /api/ready, port: http}, timeoutSeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: http}, timeoutSeconds: 3, periodSeconds: 10}
          resources: {{ toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - {name: audit, mountPath: /var/lib/dbhub}
            {{- with .Values.backend.extraVolumeMounts }}{{ toYaml . | nindent 12 }}{{- end }}
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-audit" (include "dbhub.name" .)) .Values.backend.audit.existingClaim }}
        {{- with .Values.backend.extraVolumes }}{{ toYaml . | nindent 8 }}{{- end }}
