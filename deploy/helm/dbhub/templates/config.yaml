{{- include "dbhub.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dbhub.name" . }}-config
  labels:
    {{- include "dbhub.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dbhub.name" . }}-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      include /etc/nginx/dbhub-security-headers.conf;
      location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
      location /api/ {
        # A Kubernetes Service has a stable ClusterIP; do not use Docker's DNS resolver.
        proxy_pass http://{{ include "dbhub.name" . }}-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_ignore_client_abort off;
        proxy_next_upstream off;
      }
      location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/dbhub-security-headers.conf;
      }
      location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/dbhub-security-headers.conf;
      }
      location / { try_files $uri $uri/ /index.html; }
    }
