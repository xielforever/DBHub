apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbhub.name" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend}
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "dbhub.image" .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          command: [nginx]
          args: ["-g", "daemon off;"]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources: {{ toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - {name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
      volumes:
        - {name: nginx, configMap: {name: {{ include "dbhub.name" . }}-nginx}}
        - {name: cache, emptyDir: {sizeLimit: 64Mi}}
        - {name: run, emptyDir: {sizeLimit: 8Mi}}
