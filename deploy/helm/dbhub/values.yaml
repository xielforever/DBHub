# Build/push your images; no public DBHub image is implied by this chart.
imagePullSecrets: []
existingSecret: "" # APP_SECRET_KEY, APP_ADMIN_PASSWORD, DATABASE_URL, REDIS_URL
config:
  APP_ADMIN_USERNAME: admin
  LOG_LEVEL: info
  GOMAXPROCS: "4"
  META_DB_MAX_CONNS: "10"
  DBHUB_TARGET_ALLOWLIST: ""
  DBHUB_TRUSTED_PROXY_CIDRS: ""
  CORS_ALLOWED_ORIGINS: ""
  DBHUB_AUDIT_MAX_PENDING: "10000"
  DBHUB_AUDIT_RETENTION_DAYS: "0"
  DBHUB_HISTORY_RETENTION_DAYS: "0"
  DBHUB_READ_NOTIFICATION_RETENTION_DAYS: "90"
  DBHUB_BACKUP_EXPECTED_HOURS: "0"
  DBHUB_LOGIN_MAX_ATTEMPTS: "10"
  DBHUB_LOGIN_IP_MAX_ATTEMPTS: "60"
  DBHUB_LOGIN_WINDOW_SECONDS: "300"
backend:
  replicas: 1 # Workbench transactions are process-local; multi-replica is rejected.
  image: {repository: "", tag: "", digest: "", pullPolicy: IfNotPresent}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "2", memory: 512Mi}
  audit:
    existingClaim: ""
    storageClass: null
    size: 2Gi
  extraVolumes: []
  extraVolumeMounts: []
frontend:
  replicas: 1
  image: {repository: "", tag: "", digest: "", pullPolicy: IfNotPresent}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecretName: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "off"
jdbc:
  enabled: false
  image: {repository: "", tag: "", digest: "", pullPolicy: IfNotPresent}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 384Mi}
  extraVolumes: []
  extraVolumeMounts: []
backup:
  enabled: false
  schedule: "0 2 * * *" # Cluster timezone; UTC by operational convention.
  image: {repository: "", tag: "", digest: "", pullPolicy: IfNotPresent}
  existingSecret: "" # pg_service.conf, pgpass, optional CA files
  service: dbhub
  retentionDays: 14
  timeoutSeconds: 900
  existingClaim: ""
  storageClass: null
  size: 10Gi
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
