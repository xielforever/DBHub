name: dbhub-cce-release
description: "DBHub：Gitee 检出 → kaniko 构建 → Helm 发布到 CCE dbhub（webhook 默认只构建校验，手动触发传 DEPLOY=true 才发布）"

env:
  REGISTRY: swr.cn-east-2.myhuaweicloud.com/dx_x2era
  NAMESPACE: dbhub
  RELEASE: dbhub
  KUBECONFIG_CRED: dbhub-kubeconfig
  ELB_ID: "80bf4df4-0b7c-459d-9539-fbd2242ce2a7"
  TARGET_ALLOWLIST: "10.240.0.0/16,dbhub-report44-fixture.dbhub.svc:5432"
  TAG: "${COMMIT_SHA_SHORT}-${BUILD_NUMBER}"

params:
  - name: DEPLOY
    type: bool
    default: "false"
    description: "true 时执行 Helm 发布；false 只构建并渲染校验"

steps:
  - type: print
    name: start
    message: "DBHub branch=${BRANCH} commit=${COMMIT_SHA_SHORT} build=#${BUILD_NUMBER} deploy=${DEPLOY}"

  - type: git_clone
    name: clone
    url: ""
    branch: main
    credential: gitee
    workspace: true

  - type: kaniko_build
    name: build-backend
    dockerfile: backend/Dockerfile.kaniko
    context: backend
    destination: ${REGISTRY}/dbhub-backend:${TAG}
    credential: swr-auth
    workspace: true
    timeout_secs: 1800
    resources: {cpu: "4", memory: 8Gi, requests_cpu: "1", requests_memory: "2Gi"}

  - type: kaniko_build
    name: build-frontend
    dockerfile: frontend/Dockerfile.kaniko
    context: frontend
    destination: ${REGISTRY}/dbhub-frontend:${TAG}
    credential: swr-auth
    workspace: true
    timeout_secs: 1800
    resources: {cpu: "2", memory: 4Gi, requests_cpu: "500m", requests_memory: "1Gi"}

  - type: helm_deploy
    name: render-check
    action: template
    release: ${RELEASE}
    namespace: ${NAMESPACE}
    chart: deploy/helm/dbhub
    workspace: true
    helm_version: "3.17"
    when: '${DEPLOY} != "true"'
    values_inline: |
      imagePullSecrets:
        - name: default-secret
      existingSecret: dbhub-runtime
      config:
        DBHUB_TARGET_ALLOWLIST: "${TARGET_ALLOWLIST}"
        DBHUB_NACOS_ENABLED: "true"
        DBHUB_NACOS_SERVER_ADDR: "infra-core-nacos-headless.infra.svc.cluster.local:8080"
        DBHUB_NACOS_NAMESPACE: "dbhub"
        DBHUB_NACOS_GROUP: "DEFAULT_GROUP"
        DBHUB_NACOS_DATA_ID: "dbhub.properties"
      backend:
        replicas: 1
        image:
          repository: ${REGISTRY}/dbhub-backend
          tag: "${TAG}"
          pullPolicy: IfNotPresent
        audit:
          size: 2Gi
          storageClass: csi-disk
          existingClaim: ""
        extraVolumes:
          - name: datastore-ca
            projected:
              sources:
                - configMap:
                    name: dbhub-datastore-ca
                - configMap:
                    name: dbhub-report44-fixture-ca
                    items:
                      - key: report44-fixture-ca.pem
                        path: report44-fixture-ca.pem
        extraVolumeMounts:
          - name: datastore-ca
            mountPath: /etc/dbhub/trust
            readOnly: true
      frontend:
        replicas: 1
        image:
          repository: ${REGISTRY}/dbhub-frontend
          tag: "${TAG}"
          pullPolicy: IfNotPresent
        service:
          type: LoadBalancer
          externalTrafficPolicy: Cluster
          nodePort: 30591
          annotations:
            kubernetes.io/elb.class: union
            kubernetes.io/elb.health-check-flag: "off"
            kubernetes.io/elb.id: ${ELB_ID}
            kubernetes.io/elb.lb-algorithm: ROUND_ROBIN
            kubernetes.io/elb.security-pool-protocol: "off"
      ingress:
        enabled: false
      jdbc:
        enabled: false
      backup:
        enabled: false

  - type: helm_deploy
    name: release
    action: upgrade
    release: ${RELEASE}
    namespace: ${NAMESPACE}
    chart: deploy/helm/dbhub
    workspace: true
    kubeconfig_credential: ${KUBECONFIG_CRED}
    helm_version: "3.17"
    when: '${DEPLOY} == "true"'
    atomic: true
    wait: true
    timeout_secs: 900
    values_inline: |
      imagePullSecrets:
        - name: default-secret
      existingSecret: dbhub-runtime
      config:
        DBHUB_TARGET_ALLOWLIST: "${TARGET_ALLOWLIST}"
        DBHUB_NACOS_ENABLED: "true"
        DBHUB_NACOS_SERVER_ADDR: "infra-core-nacos-headless.infra.svc.cluster.local:8080"
        DBHUB_NACOS_NAMESPACE: "dbhub"
        DBHUB_NACOS_GROUP: "DEFAULT_GROUP"
        DBHUB_NACOS_DATA_ID: "dbhub.properties"
      backend:
        replicas: 1
        image:
          repository: ${REGISTRY}/dbhub-backend
          tag: "${TAG}"
          pullPolicy: IfNotPresent
        audit:
          size: 2Gi
          storageClass: csi-disk
          existingClaim: ""
        extraVolumes:
          - name: datastore-ca
            projected:
              sources:
                - configMap:
                    name: dbhub-datastore-ca
                - configMap:
                    name: dbhub-report44-fixture-ca
                    items:
                      - key: report44-fixture-ca.pem
                        path: report44-fixture-ca.pem
        extraVolumeMounts:
          - name: datastore-ca
            mountPath: /etc/dbhub/trust
            readOnly: true
      frontend:
        replicas: 1
        image:
          repository: ${REGISTRY}/dbhub-frontend
          tag: "${TAG}"
          pullPolicy: IfNotPresent
        service:
          type: LoadBalancer
          externalTrafficPolicy: Cluster
          nodePort: 30591
          annotations:
            kubernetes.io/elb.class: union
            kubernetes.io/elb.health-check-flag: "off"
            kubernetes.io/elb.id: ${ELB_ID}
            kubernetes.io/elb.lb-algorithm: ROUND_ROBIN
            kubernetes.io/elb.security-pool-protocol: "off"
      ingress:
        enabled: false
      jdbc:
        enabled: false
      backup:
        enabled: false

  - type: http_request
    name: verify-frontend
    url: http://dbhub-dbhub-frontend.dbhub.svc.cluster.local/healthz
    method: GET
    expect_status: 200
    when: '${DEPLOY} == "true"'

  - type: http_request
    name: verify-api-ready
    url: http://dbhub-dbhub-backend.dbhub.svc.cluster.local:8080/api/ready
    method: GET
    expect_status: 200
    when: '${DEPLOY} == "true"'

  - type: http_request
    name: verify-api-health
    url: http://dbhub-dbhub-backend.dbhub.svc.cluster.local:8080/api/health
    method: GET
    expect_status: 200
    when: '${DEPLOY} == "true"'

  - type: print
    name: done
    message: "DBHub 完成：images=${REGISTRY}/dbhub-*:${COMMIT_SHA_SHORT}-${BUILD_NUMBER} deploy=${DEPLOY}"
